<DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>
</head>
<body>
    <h1>My To-Do List</h1>
    <form method="POST">
        <input type="text" name="task" placeholder="Enter a task" required>
        <button type="submit">Add Task</button>
    </form>
    <ul>
        {% for t in tasks %}
        <li>{{ t }}</li>
        {% endfor %}
    </ul>
</body>
</html>
